name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Environment Variables
        working-directory: mobile
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_VAPI_PUBLIC_KEY=${{ secrets.EXPO_PUBLIC_VAPI_PUBLIC_KEY }}" >> .env
          echo "EXPO_PUBLIC_VAPI_ASSISTANT_ID=${{ secrets.EXPO_PUBLIC_VAPI_ASSISTANT_ID }}" >> .env
          echo "EXPO_PUBLIC_NVIDIA_API_KEY=${{ secrets.EXPO_PUBLIC_NVIDIA_API_KEY }}" >> .env

      - name: Expo Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMRUTI-App-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
